name: CI

on:
  push:
  pull_request:

jobs:
  protocol:
    name: contract + server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit, database, HTTP, contract source
        run: python3 -m unittest discover -s tests -v
      - name: No private keys in tree
        run: |
          if grep -R --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=out --exclude-dir=.next \
            -E "BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY" .; then
            echo "Private key material found" >&2
            exit 1
          fi

  frontend:
    name: frontend typecheck + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
